# Adversarial Attack Configuration
attack:
  method: "pgd" # fgsm, pgd, cw, misranking, uap
  norm: "Linf"  # Linf or L2
  eps: 0.03137  # 8/255 perturbation budget
  alpha: 0.00784 # 2/255 step size for iterative attacks
  steps: 10     # Number of PGD iterations
  random_start: true

evaluation:
  batch_size: 64
  metrics: ["mAP", "Rank-1", "Rank-5", "Rank-10"]
  save_visualizations: true
  vis_output_dir: "./logs/attack_visualizations"
