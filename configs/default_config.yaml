# Baseline ReID Training Configuration
dataset:
  name: "market1501"
  data_dir: "./data/market1501"
  image_size: [256, 128] # [Height, Width] standard for ReID
  batch_size: 64
  num_workers: 4

model:
  backbone: "resnet50" # resnet50, vit_base_patch16_224, etc.
  pretrained: true
  num_classes: 751 # Market-1501 training identities
  feature_dim: 2048

training:
  epochs: 120
  lr: 0.00035
  weight_decay: 0.0005
  warmup_epochs: 10
  triplet_margin: 0.3
  device: "cuda" # cuda or cpu
